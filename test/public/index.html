<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>throughline test harness</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #181b21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #9aa4b2;
    --accent: #5b8def;
    --green-bg: #123a24;
    --green-border: #2e9e5b;
    --green-text: #7be3a4;
    --red-bg: #3a1414;
    --red-border: #b4483f;
    --red-text: #ff9a92;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #dde1e7;
      --text: #1a1d23;
      --muted: #5a6472;
      --accent: #3061d6;
      --green-bg: #e6f8ed;
      --green-border: #2e9e5b;
      --green-text: #1e6b3d;
      --red-bg: #fdeceb;
      --red-border: #c9483f;
      --red-text: #8a251e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 2rem;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 780px; }
  h1 { font-size: 1.3rem; margin-bottom: 0.25rem; }
  .sub { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }
  label.field-label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  input[type="text"] {
    width: 100%;
    padding: 0.6rem 0.7rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
  }
  .toggles { display: flex; gap: 1.5rem; margin-top: 1.1rem; flex-wrap: wrap; }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .switch {
    position: relative;
    width: 44px;
    height: 24px;
    flex: none;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: var(--border);
    border-radius: 999px;
    transition: 0.15s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    top: 3px;
    background: var(--text);
    border-radius: 50%;
    transition: 0.15s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  .toggle-label { font-size: 0.9rem; }
  .toggle-label small { display: block; color: var(--muted); font-size: 0.75rem; }
  button#tryBtn {
    margin-top: 1.25rem;
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.65rem 1.3rem;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button#tryBtn:disabled { opacity: 0.6; cursor: default; }
  .explain {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 0.9rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--border);
  }
  .result-status {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.9rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 0.9rem;
  }
  .result-status.blocked {
    background: var(--red-bg);
    border: 1px solid var(--red-border);
    color: var(--red-text);
  }
  .result-status.ok {
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    color: var(--green-text);
  }
  .meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.75rem; }
  iframe#bodyFrame {
    width: 100%;
    height: 320px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
  }
  pre#bodyText {
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem;
    max-height: 320px;
    overflow: auto;
    font-size: 0.8rem;
  }
  .hidden { display: none; }
  .placeholder { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>throughline test harness</h1>
  <p class="sub">Try a URL with and without the network filter, with and without throughline.</p>

  <div class="panel">
    <label class="field-label" for="url">Target URL</label>
    <input type="text" id="url" value="https://example.com" />

    <div class="toggles">
      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="filterToggle" />
          <span class="slider"></span>
        </label>
        <span class="toggle-label">
          Network filter
          <small>ON = locked-down network</small>
        </span>
      </div>
      <div class="toggle-row">
        <label class="switch">
          <input type="checkbox" id="proxyToggle" />
          <span class="slider"></span>
        </label>
        <span class="toggle-label">
          Use throughline proxy
          <small>ON = fetch via /raw</small>
        </span>
      </div>
    </div>

    <div class="explain" id="explain"></div>

    <button id="tryBtn">Try it</button>
  </div>

  <div class="panel" id="resultPanel">
    <p class="placeholder" id="placeholder">No request made yet.</p>
    <div id="resultBody" class="hidden">
      <div id="resultStatus" class="result-status"></div>
      <div class="meta" id="resultMeta"></div>
      <iframe id="bodyFrame" class="hidden" sandbox=""></iframe>
      <pre id="bodyText" class="hidden"></pre>
    </div>
  </div>
</div>

<script>
  const urlInput = document.getElementById('url');
  const filterToggle = document.getElementById('filterToggle');
  const proxyToggle = document.getElementById('proxyToggle');
  const explain = document.getElementById('explain');
  const tryBtn = document.getElementById('tryBtn');
  const placeholder = document.getElementById('placeholder');
  const resultBody = document.getElementById('resultBody');
  const resultStatus = document.getElementById('resultStatus');
  const resultMeta = document.getElementById('resultMeta');
  const bodyFrame = document.getElementById('bodyFrame');
  const bodyText = document.getElementById('bodyText');

  function updateExplain() {
    const f = filterToggle.checked;
    const p = proxyToggle.checked;
    let msg;
    if (!f && !p) {
      msg = 'Filter OFF + proxy OFF → direct request, nothing is blocking it.';
    } else if (!f && p) {
      msg = 'Filter OFF + proxy ON → the request goes via throughline, but the network wasn’t filtering anyway.';
    } else if (f && !p) {
      msg = 'Filter ON + proxy OFF → the locked-down network blocks direct access.';
    } else {
      msg = 'Filter ON + proxy ON → the request rides through throughline, which the filter lets past.';
    }
    explain.textContent = msg;
  }

  filterToggle.addEventListener('change', updateExplain);
  proxyToggle.addEventListener('change', updateExplain);
  updateExplain();

  function looksLikeHtml(contentType, body) {
    if (contentType && contentType.toLowerCase().includes('html')) return true;
    if (!contentType && /^\s*<(!doctype|html)/i.test(body || '')) return true;
    return false;
  }

  async function tryIt() {
    tryBtn.disabled = true;
    tryBtn.textContent = 'Loading…';
    placeholder.classList.add('hidden');
    resultBody.classList.remove('hidden');

    const url = urlInput.value.trim() || 'https://example.com';
    const filter = filterToggle.checked ? 'on' : 'off';
    const proxy = proxyToggle.checked ? 'on' : 'off';
    const qs = new URLSearchParams({ url, filter, proxy });

    try {
      const res = await fetch('/try?' + qs.toString());
      const data = await res.json();

      resultStatus.className = 'result-status ' + (data.blocked ? 'blocked' : (data.ok ? 'ok' : 'blocked'));
      resultStatus.textContent = data.blocked
        ? 'BLOCKED'
        : (data.ok ? 'REACHABLE' : 'ERROR (status ' + data.status + ')');

      resultMeta.textContent = 'HTTP status: ' + data.status + ' · content-type: ' + (data.contentType || '(none)');

      if (!data.blocked && looksLikeHtml(data.contentType, data.body)) {
        bodyFrame.classList.remove('hidden');
        bodyText.classList.add('hidden');
        bodyFrame.srcdoc = data.body;
      } else {
        bodyFrame.classList.add('hidden');
        bodyText.classList.remove('hidden');
        bodyText.textContent = data.body;
      }
    } catch (e) {
      resultStatus.className = 'result-status blocked';
      resultStatus.textContent = 'ERROR';
      resultMeta.textContent = String(e);
      bodyFrame.classList.add('hidden');
      bodyText.classList.remove('hidden');
      bodyText.textContent = '';
    } finally {
      tryBtn.disabled = false;
      tryBtn.textContent = 'Try it';
    }
  }

  tryBtn.addEventListener('click', tryIt);
</script>
</body>
</html>
