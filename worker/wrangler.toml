name = "throughline"
main = "src/index.js"
compatibility_date = "2025-06-01"

# The passphrase is a secret, not a var — set it with:
#   npx wrangler secret put PROXY_KEY
# There are no bindings: the proxy keeps no state beyond the signed session
# cookie, which needs nothing provisioned.

[observability]
enabled = true

# Holds one dynamic value: the current URL of the self-hosted YouTube backend
# (Invidious) behind a Cloudflare quick tunnel, which the Mac re-registers on
# every restart. See the /yt routes in index.js.
[[kv_namespaces]]
binding = "YT"
id = "e02e7f2565ed49b381b189ad154481fa"
